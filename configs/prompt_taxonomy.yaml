prompt_taxonomy:
  style_families:
    - id: anatolian_geometric
      label: "Anadolu Geometric"
      description: "Traditional Anatolian geometric carpet patterns"
    - id: kilim_inspired
      label: "Kilim-inspired"
      description: "Flat-weave kilim patterns with bold geometric shapes"
    - id: ottoman_floral
      label: "Ottoman Floral"
      description: "Ottoman-era floral and arabesque patterns"
    - id: persian_medallion
      label: "Persian Medallion"
      description: "Central medallion with intricate borders"
    - id: contemporary_geometric
      label: "Contemporary Geometric"
      description: "Modern geometric patterns with clean lines"
    - id: contemporary_organic
      label: "Contemporary Organic"
      description: "Modern organic and abstract patterns"
    - id: minimalist
