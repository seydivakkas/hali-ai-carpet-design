name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system -e ".[dev]"
    - name: Lint
      run: |
        uv run ruff check .
        uv run ruff format --check .
    - name: Test
      run: |
        uv run pytest -q
