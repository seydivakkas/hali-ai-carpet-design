training:
  resolution: 1024
  train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_train_steps: 1000
  rank: 16
  alpha: 16
  mixed_precision: fp16
  gradient_checkpointing: true
  use_8bit_adam: false
  checkpointing_steps: 100
  validation_steps: 100
  seed: 42

lora:
  target: unet
  train_text_encoder: false
  adapter_name: carpet_domain_v1

note: >
  Full LoRA training configuration per spec Section 15.3.
  These parameters are starting hypotheses and should be adjusted
  based on actual hardware/data smoke test results.
