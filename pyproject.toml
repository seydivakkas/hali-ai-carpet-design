[project]
name = "hali-ai-carpet-design"
version = "0.1.0"
description = "Halı AI Carpet Design — Traceable Diffusion-Based Carpet Design Studio"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "diffusers>=0.32,<1",
  "transformers>=4.47,<5",
  "accelerate>=1,<2",
  "peft>=0.14,<1",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.27,<1",
  "streamlit>=1.41,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "numpy<2.0",
  "pandas>=2.2,<3",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.6,<2",
  "plotly>=6,<7",
  "jinja2>=3.1,<4",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "orjson>=3.10,<4",
  "filelock>=3.16,<4",
  "psutil>=6,<8",
  "torch==2.8.0",
  "opencv-python>=4.11.0.86",
  "torchvision==0.23.0",
  "datasets>=4.8.5",
  "faiss-cpu>=1.14.3",
  "bitsandbytes>=0.48,<1",
  "kaggle>=1.7,<2",
  "openpyxl>=3.1,<4",
  "modelscope>=1.38,<2",
]

[project.optional-dependencies]
training = [
  "datasets>=3,<5",
  "tensorboard>=2.18,<3",
]
retrieval = [
  "faiss-cpu>=1.9,<2",
]
evaluation = [
  "clean-fid>=0.1.35,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.5,<4",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "types-PyYAML>=6",
  "types-Pillow>=10",
]

[project.scripts]
carpet-designer = "carpet_designer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carpet_designer"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["append.py", "create_ci.py", "create_pages.py", "fix_cli.py", "fix_repo.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["carpet_designer"]

[tool.ruff.lint.per-file-ignores]
"src/carpet_designer/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["carpet_designer"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "sklearn.*",
  "faiss.*",
  "diffusers.*",
  "transformers.*",
  "accelerate.*",
  "peft.*",
  "safetensors.*",
  "plotly.*",
  "streamlit.*",
  "tensorboard.*",
  "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: marks tests as slow",
  "gpu: marks tests requiring GPU",
  "smoke: marks smoke tests",
]

[dependency-groups]
dev = [
    "types-psutil>=7.2.2.20260518",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
